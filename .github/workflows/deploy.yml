name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore workloads
        run: dotnet workload restore ModernLNUElectronicsWebSite/ModernLNUElectronicsWebSite.csproj

      - name: Publish
        run: dotnet publish ModernLNUElectronicsWebSite/ModernLNUElectronicsWebSite.csproj -c Release -o publish

      - name: Rewrite <base href>
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO" = "${GITHUB_REPOSITORY_OWNER,,}.github.io" ]; then
            BASE="/"
          else
            BASE="/$REPO/"
          fi
          echo "base href -> $BASE"
          sed -i -E "s#<base href=\"/\" ?/?>#<base href=\"$BASE\" />#" publish/wwwroot/index.html
          grep -o '<base [^>]*>' publish/wwwroot/index.html

      - name: SPA fallback + disable Jekyll
        run: |
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
