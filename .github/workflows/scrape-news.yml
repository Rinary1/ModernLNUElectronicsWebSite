name: Scrape data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      news_pages:
        description: "Скільки сторінок стрічки новин обійти (5 новин на сторінку). Архів накопичувальний: постав 261, щоб заповнити його вглиб"
        type: string
        default: "6"
      refresh:
        description: "Перезавантажити вже збережені статті та профілі, а не лише нові"
        type: boolean
        default: false
      allow_shrink:
        description: "Дозволити запис, навіть якщо список раптово скоротився вдвічі (за замовчуванням такий запуск падає)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: scrape-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Залежності для розбору PDF
        run: pip install --quiet pdfplumber

      - name: Run scraper
        run: >
          dotnet run --project WebSite.Scraper/WebSite.Scraper.csproj -c Release --
          --out WebSite/wwwroot/data
          --news-pages ${{ inputs.news_pages || '6' }}
          ${{ (github.event_name == 'workflow_dispatch' && inputs.refresh) && '--refresh' || '' }}
          ${{ (github.event_name == 'workflow_dispatch' && inputs.allow_shrink) && '--allow-shrink' || '' }}

      - name: Розібрати PDF розкладу
        run: python tools/schedule/parse_schedules.py WebSite/wwwroot/data

      - name: Перезібрати пошуковий індекс
        run: >
          dotnet run --project WebSite.Scraper/WebSite.Scraper.csproj -c Release --
          --out WebSite/wwwroot/data --index-only

      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIR=WebSite/wwwroot/data
          git add "$DIR"
          if git diff --cached --quiet -- "$DIR"; then
            echo "Даних не змінилося — коміт не потрібен."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): оновлення $(date -u +%FT%TZ)"
          git push
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
