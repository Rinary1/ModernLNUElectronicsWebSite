name: Scrape data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      news_pages:
        description: "Скільки сторінок стрічки новин обійти (5 новин на сторінку)"
        type: string
        default: "6"
      refresh:
        description: "Перезавантажити вже збережені статті та профілі, а не лише нові"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: scrape-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run scraper
        run: >
          dotnet run --project tools/Scraper/Scraper.csproj -c Release --
          --out ModernLNUElectronicsWebSite/wwwroot/data
          --news-pages ${{ inputs.news_pages || '6' }}
          ${{ (github.event_name == 'workflow_dispatch' && inputs.refresh) && '--refresh' || '' }}

      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIR=ModernLNUElectronicsWebSite/wwwroot/data
          git add "$DIR"
          if git diff --cached --quiet -- "$DIR"; then
            echo "Даних не змінилося — коміт не потрібен."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): оновлення $(date -u +%FT%TZ)"
          git push
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
